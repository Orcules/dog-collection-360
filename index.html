<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כל דגם, מכל זווית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="frames/manifest.js"></script>
<style>
:root{
  --paper:#EEF0F3;
  --paper-2:#E5E8ED;
  --stage:#FFFFFF;
  --ink:#101418;
  --ink-2:#5B6472;
  --ink-3:#8B93A0;
  --rule:#D6DAE1;
  --yaw:#2E4A6B;
  --lift:#B8792B;
  --shadow:0 22px 54px -26px rgba(16,20,24,.40);
  --serif:"Frank Ruhl Libre","Times New Roman",serif;
  --sans:"Heebo","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1215; --paper-2:#171B20; --ink:#EDEFF2; --ink-2:#98A1AE; --ink-3:#6B7480;
    --rule:#252A31; --yaw:#7FA8D8; --lift:#E0A557;
    --shadow:0 26px 64px -28px rgba(0,0,0,.88);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1215; --paper-2:#171B20; --ink:#EDEFF2; --ink-2:#98A1AE; --ink-3:#6B7480;
  --rule:#252A31; --yaw:#7FA8D8; --lift:#E0A557;
  --shadow:0 26px 64px -28px rgba(0,0,0,.88);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
     font-weight:300;font-size:16px;line-height:1.6}
.shell{max-width:1060px;margin:0 auto;padding:0 30px}

/* ---------- masthead ---------- */
.masthead{padding:38px 0 26px;display:grid;gap:22px;
          grid-template-columns:minmax(0,1fr) auto;align-items:end}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.17em;
         text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(32px,4.6vw,50px);
   line-height:1.04;margin:0;letter-spacing:-.012em;text-wrap:balance}

/* graphic key: what each direction of the mouse does */
.guide{display:flex;gap:26px;padding-bottom:4px}
.guide figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.guide svg{width:38px;height:38px;display:block;fill:none;stroke:currentColor;
           stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.guide figcaption{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
                  text-transform:uppercase;color:var(--ink-3)}
.guide .g-yaw{color:var(--yaw)} .guide .g-lift{color:var(--lift)}

/* ---------- the rig ---------- */
.rig{display:grid;gap:0 30px;align-items:start;
     grid-template-columns:auto 56px minmax(210px,1fr);
     grid-template-rows:auto 44px}
.stagewrap{grid-column:1;grid-row:1}
#stage{position:relative;background:var(--shot,var(--stage));border-radius:3px;
       overflow:hidden;width:fit-content;
       cursor:crosshair;touch-action:none;box-shadow:var(--shadow)}
/* every clip has its own shape, so the frame takes the shape of the clip inside it:
   nothing is letterboxed, nothing is stretched, and the scales follow that width */
#stage canvas{display:block;width:auto;height:auto;
              max-height:min(60vh,560px);
              max-width:min(560px,calc(100vw - 150px))}
#stage:focus-visible{outline:2px solid var(--yaw);outline-offset:3px}
.cross{position:absolute;background:rgba(16,20,24,.10);pointer-events:none;opacity:0;
       transition:opacity .2s ease}
#stage.live .cross{opacity:1}
#cx{top:0;bottom:0;width:1px}
#cy{left:0;right:0;height:1px}
.tag{position:absolute;top:13px;inset-inline-start:13px;margin:0;font-family:var(--mono);
     font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#5B6472;
     background:rgba(255,255,255,.88);padding:5px 9px;border-radius:2px;
     pointer-events:none;display:flex;align-items:center;gap:7px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.yaw{color:#2E4A6B} .tag.lift{color:#8C5A18}

/* the only instruction on the page, and it leaves on the first move */
#hint{position:absolute;inset:0;z-index:2;display:grid;place-content:center;
      justify-items:center;gap:10px;background:rgba(255,255,255,.82);
      pointer-events:none;transition:opacity .45s ease}
#hint.gone{opacity:0}
#hint svg{width:min(72%,264px);height:auto;display:block;fill:none;stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round}
#hint .ax{stroke:#2E4A6B} #hint .ay{stroke:#8C5A18}
#hint text{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;
           stroke:#fff;stroke-width:3.5;paint-order:stroke}
#hint .tx{fill:#2E4A6B} #hint .ty{fill:#8C5A18}
#hint p{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.13em;
        text-transform:uppercase;color:#3B424C}

#loader{position:absolute;inset:0;background:var(--stage);display:grid;place-content:center;
        justify-items:center;gap:13px;font-family:var(--mono);font-size:11px;
        letter-spacing:.13em;text-transform:uppercase;color:#8B93A0;transition:opacity .3s;
        z-index:3}
#loader.done{opacity:0;pointer-events:none}
.track{width:150px;height:2px;background:#E4E7EC}
.track i{display:block;height:100%;width:0;background:#2E4A6B;transition:width .1s linear}

/* calibrated scales */
.scale{position:relative;color:var(--ink-3)}
.scale.h{grid-column:1;grid-row:2}
.scale.v{grid-column:2;grid-row:1;height:100%}
.tick{position:absolute;background:var(--rule)}
.scale.h .tick{top:0;width:1px;height:5px}
.scale.h .tick.maj{height:10px}
.scale.v .tick{inset-inline-start:0;height:1px;width:5px}
.scale.v .tick.maj{width:10px}
.lab{position:absolute;font-family:var(--mono);font-size:10px;color:var(--ink-3);
     font-variant-numeric:tabular-nums;white-space:nowrap}
.scale.h .lab{top:13px;transform:translateX(50%)}
.scale.v .lab{inset-inline-start:14px;transform:translateY(-50%)}
.cursor{position:absolute;transition:opacity .25s ease}
.scale.h .cursor{top:-2px;width:2px;height:13px;background:var(--yaw)}
.scale.v .cursor{inset-inline-start:-2px;height:2px;width:13px;background:var(--lift)}
.scale.idle .cursor{opacity:.22}

/* instrument panel */
.panel{grid-column:3;grid-row:1/span 2;display:flex;flex-direction:column;gap:20px;
       padding-top:2px;max-width:310px}
.now{display:flex;align-items:baseline;gap:10px;margin:0}
.now b{font-family:var(--serif);font-size:46px;font-weight:900;line-height:.9;
       letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.now span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
          text-transform:uppercase;color:var(--ink-3)}
.dials{display:flex;flex-direction:column;gap:14px;padding:16px 0;
       border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.dial{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:11px;
      font-family:var(--mono)}
.dial u{width:14px;height:2px;text-decoration:none;display:block}
.dial.yaw u{background:var(--yaw)} .dial.lift u{background:var(--lift)}
.dial em{font-style:normal;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--ink-3)}
.dial b{font-size:25px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;
        letter-spacing:-.02em}
.dial.yaw b{color:var(--yaw)} .dial.lift b{color:var(--lift)}
.dial.off b{color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button.btn{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--ink-2);
           background:none;border:1px solid var(--rule);border-radius:2px;padding:8px 14px;
           cursor:pointer;transition:border-color .18s,color .18s}
button.btn:hover{border-color:var(--ink-3);color:var(--ink)}
button.btn[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500}
button.btn:focus-visible{outline:2px solid var(--yaw);outline-offset:2px}

/* ---------- contact sheet ---------- */
section{margin:72px 0 0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
      border-bottom:1px solid var(--rule);padding-bottom:11px;margin-bottom:20px}
h2{font-family:var(--serif);font-weight:700;font-size:23px;margin:0;letter-spacing:-.008em}
.head p{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.11em;
        text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:9px}
.cell{position:relative;padding:0;border:0;background:var(--stage);border-radius:2px;
      overflow:hidden;aspect-ratio:1/1;cursor:pointer;
      box-shadow:0 0 0 1px var(--rule);transition:box-shadow .18s,transform .18s}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--ink-3)}
.cell[aria-current="true"]{box-shadow:0 0 0 2px var(--ink)}
.cell:focus-visible{outline:2px solid var(--yaw);outline-offset:2px}
.cell b{position:absolute;top:5px;inset-inline-start:6px;font-family:var(--mono);
        font-size:10px;font-weight:500;color:#5B6472;background:rgba(255,255,255,.85);
        padding:1px 4px;border-radius:2px;font-variant-numeric:tabular-nums}
footer{margin:60px 0 44px;padding-top:16px;border-top:1px solid var(--rule)}
footer a{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
         color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent}
footer a:hover{color:var(--ink);border-bottom-color:currentColor}
footer a::after{content:" ←"}

@media (max-width:900px){
  .masthead{grid-template-columns:1fr}
  .guide{justify-content:flex-start}
  .rig{grid-template-columns:auto 50px;gap:0 22px}
  .panel{grid-column:1/span 2;grid-row:3;padding-top:26px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .cell:hover{transform:none}
}
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div>
      <p class="eyebrow">קולקציית ביגוד לכלבים</p>
      <h1>כל דגם,<br>מכל זווית</h1>
    </div>
    <div class="guide" role="img"
         aria-label="תנועת עכבר לצדדים מסובבת את הפריט, תנועה למעלה ולמטה משנה את גובה המצלמה">
      <figure class="g-yaw">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M5 20h30M12 13l-7 7 7 7M28 13l7 7-7 7"/>
        </svg>
        <figcaption>סיבוב</figcaption>
      </figure>
      <figure class="g-lift">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 5v30M13 12l7-7 7 7M13 28l7 7 7-7"/>
        </svg>
        <figcaption>גובה מצלמה</figcaption>
      </figure>
    </div>
  </header>

  <div class="rig">
    <div class="stagewrap">
      <div id="stage" tabindex="0" role="application"
           aria-label="מציג מוצר. חיצים ימינה ושמאלה לסיבוב, למעלה ולמטה לגובה המצלמה.">
        <canvas id="cv" width="640" height="640"></canvas>
        <div class="cross" id="cx"></div>
        <div class="cross" id="cy"></div>
        <p class="tag" id="tag">עמדת פתיחה</p>
        <div id="hint">
          <svg viewBox="0 0 260 180" aria-hidden="true">
            <g class="ax"><path d="M28 100h204M44 86L28 100l16 14M216 86l16 14-16 14"/></g>
            <g class="ay"><path d="M130 36v112M116 50l14-14 14 14M116 134l14 14 14-14"/></g>
            <text class="ty" x="118" y="26" text-anchor="end">גובה מצלמה</text>
            <text class="tx" x="232" y="136" text-anchor="end">סיבוב</text>
          </svg>
          <p>הזז את העכבר על התמונה</p>
        </div>
        <div id="loader"><span id="ldText">טוען</span><div class="track"><i id="ldBar"></i></div></div>
      </div>
    </div>
    <div class="scale v" id="scaleV"></div>
    <div class="scale h" id="scaleH"></div>

    <div class="panel">
      <p class="now"><b id="nowNum">01</b><span>פריט נוכחי</span></p>
      <div class="dials">
        <div class="dial yaw" id="dialYaw"><u></u><em>סיבוב</em><b id="valYaw">0°</b></div>
        <div class="dial lift off" id="dialLift"><u></u><em>גובה מצלמה</em><b id="valLift">0°</b></div>
      </div>
      <div class="actions">
        <button class="btn" id="btnAuto" aria-pressed="false">הרץ הדגמה</button>
        <button class="btn" id="btnPrev">הקודם</button>
        <button class="btn" id="btnNext">הבא</button>
      </div>
    </div>
  </div>

  <section>
    <div class="head">
      <h2>הקולקציה</h2>
      <p><span id="sheetCount">0</span> פריטים</p>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <a href="assets/">חומרי הקולקציה להורדה</a>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var M = window.MANIFEST;
  var stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d', { alpha: false });
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!M || !M.items) { $('ldText').textContent = 'לא נמצאו פריימים'; return; }

  // only products that carry BOTH animations
  var items = M.items.filter(function (it) {
    return it.strips && it.strips.spin && it.strips.tilt;
  }).sort(function (a, b) { return a.index - b.index; });
  if (!items.length) { $('ldText').textContent = 'אין פריטים עם שתי אנימציות'; return; }

  var N = M.frames || 72;
  $('sheetCount').textContent = items.length;

  // ---------- calibrated scales ----------
  // horizontal: 0deg at the start edge. vertical: 90deg (top-down) at the TOP,
  // because raising the pointer raises the camera.
  function buildScale(el, majors, step, max, invert) {
    var horiz = el.classList.contains('h');
    var frag = document.createDocumentFragment();
    for (var v = 0; v <= max + 0.001; v += step) {
      var pct = 100 * v / max, maj = majors.indexOf(v) >= 0;
      if (invert) pct = 100 - pct;
      var t = document.createElement('i');
      t.className = 'tick' + (maj ? ' maj' : '');
      t.style[horiz ? 'left' : 'top'] = pct + '%';
      frag.appendChild(t);
      if (maj) {
        var l = document.createElement('span');
        l.className = 'lab';
        l.textContent = v + '°';
        l.style[horiz ? 'left' : 'top'] = pct + '%';
        frag.appendChild(l);
      }
    }
    var c = document.createElement('i');
    c.className = 'cursor';
    frag.appendChild(c);
    el.appendChild(frag);
    return c;
  }
  var curH = buildScale($('scaleH'), [0, 90, 180, 270, 360], 15, 360, false);
  var curV = buildScale($('scaleV'), [0, 30, 60, 90], 7.5, 90, true);

  // the frame changes shape with every clip, so the horizontal scale is re-measured
  // against it rather than against the column it sits in
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      $('scaleH').style.width = stage.getBoundingClientRect().width + 'px';
    }).observe(stage);
  }

  // ---------- contact sheet ----------
  var grid = $('grid');
  items.forEach(function (it, i) {
    var b = document.createElement('button');
    b.className = 'cell';
    b.type = 'button';
    b.setAttribute('aria-label', 'פריט ' + it.index);
    b.innerHTML = '<img loading="lazy" alt="" src="' + it.strips.spin.dir + '/000.webp">' +
                  '<b>' + String(it.index).padStart(2, '0') + '</b>';
    b.addEventListener('click', function () { select(i); });
    grid.appendChild(b);
  });

  // ---------- state ----------
  var cur = null, at = -1, token = 0;
  var axis = 'spin', pending = null;
  var target = { spin: 0, tilt: 0 };
  var shown = { spin: 0, tilt: 0 };
  var energy = { x: 0, y: 0 };
  var auto = false, autoT = 0, lock = 0, settle = 0;
  var MAX_STEP = 12;         // frames per tick while following the pointer
  var EASE = 0.7;            // how hard the frame chases the pointer
  var REWIND_SECONDS = 0.65; // time for a full strip to run backwards to frame 0

  var hint = $('hint'), hintGone = false;
  function dropHint() {
    if (hintGone) return;
    hintGone = true;
    hint.classList.add('gone');
    setTimeout(function () { hint.remove(); }, 600);
  }

  function loadStrip(strip, tick) {
    return new Promise(function (done) {
      var list = new Array(strip.count), queued = 0, active = 0;
      (function pump() {
        while (active < 10 && queued < strip.count) {
          (function (n) {
            active++; queued++;
            var img = new Image();
            img.decoding = 'async';
            img.onload = img.onerror = function () {
              active--; list[n] = img; tick();
              if (queued >= strip.count && active === 0) done(list); else pump();
            };
            img.src = strip.dir + '/' + String(n).padStart(3, '0') + '.webp';
          })(queued);
        }
      })();
    });
  }

  function select(i) {
    if (i === at) return;
    at = i;
    var it = items[i];
    [].forEach.call(grid.children, function (c, k) {
      c.setAttribute('aria-current', k === i ? 'true' : 'false');
    });
    $('nowNum').textContent = String(it.index).padStart(2, '0');
    var my = ++token, total = it.strips.spin.count + it.strips.tilt.count, n = 0;
    var loader = $('loader'), bar = $('ldBar');
    loader.classList.remove('done');
    bar.style.width = '0%';
    $('ldText').textContent = 'טוען פריט ' + String(it.index).padStart(2, '0');
    var bump = function () { bar.style.width = (100 * ++n / total).toFixed(1) + '%'; };

    Promise.all([loadStrip(it.strips.spin, bump), loadStrip(it.strips.tilt, bump)])
      .then(function (res) {
        if (my !== token) return;
        cur = { index: it.index, spin: res[0], tilt: res[1] };
        var f = res[0][0];
        if (f && f.naturalWidth) { cv.width = f.naturalWidth; cv.height = f.naturalHeight; }
        stage.style.setProperty('--shot', it.bg || '#fff');
        axis = 'spin'; pending = null;
        target = { spin: 0, tilt: 0 };
        shown = { spin: 0, tilt: 0 };
        loader.classList.add('done');
        paint(); readout();
      });
  }

  // ---------- pointer ----------
  var prev = null, lastP = null, engaged = false;

  function frameFor(a, p) {
    return a === 'spin' ? p.x * (cur.spin.length - 1) : (1 - p.y) * (cur.tilt.length - 1);
  }

  function onMove(e) {
    if (!cur) return;
    var r = stage.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    var inside = fx >= 0 && fx <= 1 && fy >= 0 && fy <= 1;
    if (!engaged) {
      if (!inside) return;                       // the gesture has to start on the stage
      engaged = true;
    } else if (fx < -0.3 || fx > 1.3 || fy < -0.3 || fy > 1.3) {
      engaged = false; prev = null;              // hand wandered off; let go
      stage.classList.remove('live');
      return;
    }
    dropHint();
    if (auto) setAuto(false);
    // A frame is as wide as its clip, so frames differ in width from one another.
    // Reading the hand over a square band instead - the frame's longer side, centred
    // on it - keeps one hand movement worth the same number of degrees on every clip
    // and on both axes, rather than spinning faster the narrower the picture is.
    var band = Math.max(r.width, r.height);
    var bx = (e.clientX - (r.left + r.width / 2)) / band + 0.5;
    var by = (e.clientY - (r.top + r.height / 2)) / band + 0.5;
    // running past an edge holds the move at its end instead of freezing it half way
    var p = { x: Math.min(1, Math.max(0, bx)), y: Math.min(1, Math.max(0, by)) };
    stage.classList.add('live');
    $('cx').style.left = (Math.min(1, Math.max(0, fx)) * 100) + '%';
    $('cy').style.top = (Math.min(1, Math.max(0, fy)) * 100) + '%';

    if (prev) {
      energy.x = energy.x * 0.7 + Math.abs(p.x - prev.x);
      energy.y = energy.y * 0.7 + Math.abs(p.y - prev.y);
      if (!pending && !lock) {
        if (energy.x > energy.y * 2 && energy.x > 0.004) request('spin');
        else if (energy.y > energy.x * 2 && energy.y > 0.004) request('tilt');
      }
    }
    prev = p; lastP = p;

    // the hand's position along the band IS the frame, so the move always has
    // somewhere left to go and always reaches its end
    if (!pending) target[axis] = frameFor(axis, p);
  }

  // Frame 0 of both strips is the same photograph. Winding the live axis back to it
  // before swapping is what removes the jump between the two animations.
  function request(want) {
    if (want !== axis && !pending) pending = want;   // once started, a rewind finishes
  }

  // tracked on the window, so the gesture survives the pointer leaving the picture
  window.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerdown', function (e) {
    stage.setPointerCapture(e.pointerId); engaged = true; onMove(e);
  });

  stage.addEventListener('keydown', function (e) {
    if (!cur) return;
    var step = e.shiftKey ? 8 : 3, k = e.key, want, delta;
    if (k === 'ArrowRight' || k === 'ArrowLeft') {
      want = 'spin'; delta = k === 'ArrowRight' ? step : -step;
    } else if (k === 'ArrowUp' || k === 'ArrowDown') {
      want = 'tilt'; delta = k === 'ArrowUp' ? step : -step;
    } else return;
    e.preventDefault();
    dropHint();
    if (auto) setAuto(false);
    if (pending) return;
    if (want !== axis) { request(want); return; }   // this press only rewinds
    target[want] = clamp(target[want] + delta, cur[want].length);
  });
  function clamp(v, len) { return Math.max(0, Math.min(len - 1, v)); }

  function setAuto(on) {
    auto = on; autoT = 0;
    if (on) dropHint();
    $('btnAuto').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('btnAuto').textContent = on ? 'עצור הדגמה' : 'הרץ הדגמה';
  }
  $('btnAuto').addEventListener('click', function () { setAuto(!auto); });
  $('btnPrev').addEventListener('click', function () { select((at - 1 + items.length) % items.length); });
  $('btnNext').addEventListener('click', function () { select((at + 1) % items.length); });

  // ---------- render ----------
  function frame(a, v) {
    var s = cur[a];
    return s[Math.max(0, Math.min(s.length - 1, Math.round(v)))];
  }
  function paint() {
    if (!cur) return;
    var img = frame(axis, shown[axis]);
    if (img && img.naturalWidth) ctx.drawImage(img, 0, 0, cv.width, cv.height);
  }
  function readout() {
    if (!cur) return;
    var y = Math.round(shown.spin / (cur.spin.length - 1) * 360);
    var l = Math.round(shown.tilt / (cur.tilt.length - 1) * 90);
    $('valYaw').textContent = y + '°';
    $('valLift').textContent = l + '°';
    curH.style.left = (y / 360 * 100) + '%';
    curV.style.top = (100 - l / 90 * 100) + '%';
    var onSpin = axis === 'spin';
    $('scaleH').classList.toggle('idle', !onSpin);
    $('scaleV').classList.toggle('idle', onSpin);
    $('dialYaw').classList.toggle('off', !onSpin);
    $('dialLift').classList.toggle('off', onSpin);
    var t = $('tag');
    if (pending) {
      t.className = 'tag';
      t.textContent = 'חוזר לעמדת פתיחה';
    } else {
      t.className = 'tag ' + (onSpin ? 'yaw' : 'lift');
      t.textContent = onSpin ? 'סיבוב · ' + y + '°' : 'גובה מצלמה · ' + l + '°';
    }
  }

  function tick() {
    if (cur) {
      if (auto) {
        autoT += 1 / 60;
        var span = 11, t = (autoT % span) / span;
        if (t < 0.52) {
          request('spin');
          if (axis === 'spin') target.spin = (t / 0.52) * (cur.spin.length - 1);
        } else {
          request('tilt');
          if (axis === 'tilt') {
            var u = (t - 0.52) / 0.48, tri = u < 0.5 ? u * 2 : (1 - u) * 2;
            target.tilt = tri * (cur.tilt.length - 1);
          }
        }
      }
      if (pending) {
        // fast reverse: play the live strip backwards at a steady rate until it is
        // back on frame 0, then swap. Both strips share that frame, so nothing jumps.
        var len = cur[axis].length;
        var back = reduce ? len : len / (REWIND_SECONDS * 60);
        shown[axis] = Math.max(0, shown[axis] - back);
        if (shown[axis] <= 0.0005) {
          axis = pending;
          pending = null;
          shown[axis] = 0;
          // pick up the new axis from wherever the hand is now
          target[axis] = lastP ? frameFor(axis, lastP) : 0;
          settle = reduce ? 0 : 90;  // approach it at playback speed, not instantly
          lock = 18;                 // ignore jitter so the axes cannot flip-flop
          energy.x = energy.y = 0;
        }
      } else if (settle > 0) {
        // just after a swap the new axis cranes into place at the same steady rate
        // as the rewind, so the two moves read as one continuous shot
        settle--;
        var rate = cur[axis].length / (REWIND_SECONDS * 60);
        var gap = target[axis] - shown[axis];
        shown[axis] += Math.max(-rate, Math.min(rate, gap));
        if (Math.abs(gap) <= rate) settle = 0;
      } else {
        // follow the pointer directly - light easing only, so there is no lag
        var d = (target[axis] - shown[axis]) * (reduce ? 1 : EASE);
        if (d > MAX_STEP) d = MAX_STEP; else if (d < -MAX_STEP) d = -MAX_STEP;
        shown[axis] += d;
      }
      // the axis that is not on screen sits at the shared origin, so the dials
      // never report a rotation the viewer cannot see
      var other = axis === 'spin' ? 'tilt' : 'spin';
      shown[other] = 0;
      target[other] = 0;
      if (lock > 0) lock--;
      paint(); readout();
    }
    requestAnimationFrame(tick);
  }

  select(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
